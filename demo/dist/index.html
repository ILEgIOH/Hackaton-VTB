<title>ComputeCollateral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--navy:#051F45;--teal:#4C9DB0;--teal-d:#2E7487;--red:#C1121F;--bg:#FFF3E1;--card:#FFFBF4;--line:#EBDCC5;--slate:#3E4E68;--amber:#C98A1B;--teal-bg:#E2EFF1;--red-bg:#FBE1E3;--amber-bg:#FBEFD6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--navy);font:400 16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--teal-d)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--slate)}
/* top bar */
.top{background:var(--navy);color:#fff;height:58px;display:flex;align-items:center;padding:0 48px;gap:36px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;text-decoration:none;color:#fff;cursor:pointer}
.logo b{font-weight:700}.logo span{font-weight:300;opacity:.85}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--navy)}
.nav{display:flex;gap:6px;height:100%}
.nav a{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:0 14px;color:#b8c4d8;text-decoration:none;font-weight:500;font-size:15px;height:100%;border-bottom:3px solid transparent;cursor:pointer}
.nav a:hover{color:#fff}.nav a.on{color:#fff;font-weight:700;border-bottom-color:var(--teal)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.top .sp{flex:1}
.icon-btn{background:none;border:0;color:#cdd7e8;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{color:#fff;background:#ffffff14}
.user{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;background:none;border:0;color:#fff;text-align:left}
.avatar{width:36px;height:36px;border-radius:50%;background:#1f3f73;display:grid;place-items:center;font-weight:700;font-size:13px}
.user small{display:block;color:#9fb0cc;font-size:12px}
.menu{position:absolute;right:0;top:46px;background:var(--card);color:var(--navy);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #051f4526;min-width:180px;padding:6px;z-index:30}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:0;background:none;color:var(--navy);text-decoration:none;cursor:pointer;font-size:14px}
.menu a:hover,.menu button:hover{background:var(--bg)}
/* layout */
main{max-width:1280px;margin:0 auto;padding:44px 32px 80px}
h1{font-size:34px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:21px;font-weight:600;margin:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.crumbs{font-size:14px;margin-bottom:12px;color:var(--slate)}.crumbs a{color:var(--navy);text-decoration:none;cursor:pointer}
.sub{color:var(--slate);margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy);transition:.15s}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.primary:hover{background:#0b2f66}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
/* hero */
.hero{background:linear-gradient(135deg,#0a2a5c,#051F45);color:#fff;border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;margin-bottom:30px}
.hero.three{grid-template-columns:repeat(3,1fr)}
.hero>div{padding:32px 36px;border-left:1px solid #ffffff1c}.hero>div:first-child{border:0}
.hero .l{color:#b6c3da;font-size:15px}
.hero .v{font-size:44px;font-weight:600;line-height:1.1;margin:14px 0 10px;letter-spacing:-.02em;white-space:nowrap}
.hero .s{color:#9fb0cc;font-size:14px}
.hero .v.amber{color:#f1b95b}.hero .v.teal{color:#8fd0df}
.hero .alert{color:#ff8a93}
.hero .strip{grid-column:1/-1;border-top:1px solid #ffffff1c;border-left:0;padding:16px 36px;font-size:14px;color:#cfd9ea;display:flex;gap:10px;align-items:center}
.hero .liq{background-image:repeating-linear-gradient(135deg,#ffffff08 0 10px,transparent 10px 20px)}
/* tabs */
.tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:0 0 28px}
.tabs.plain{border:0;margin-bottom:20px}
.tab{padding:12px 0;color:var(--slate);cursor:pointer;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;font-size:17px}
.tab small{color:#8a96a8;margin-left:5px;font-size:13px}
.tab.on{color:var(--navy);font-weight:700;border-bottom-color:var(--teal)}
.tabs .end{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--slate);cursor:pointer;background:none;border:0;padding:0}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--slate);font-size:14px;text-align:left;padding:18px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{white-space:nowrap;padding:18px 16px;border-bottom:1px solid #f1e6d3;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fff7ea}
.tbl td:first-child{white-space:normal}.tbl .name{font-weight:600;font-size:17px}.tbl .sm{color:var(--slate);font-size:14px;margin-top:2px}
.tblwrap{overflow-x:auto;padding:0 8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--teal)}
.s-ok{color:var(--teal-d)}.s-ok .dot,.dot.ok{background:var(--teal)}
.s-near{color:var(--amber)}.s-near .dot,.dot.near{background:var(--amber)}
.s-breach,.s-swap{color:var(--red)}.s-breach .dot,.s-swap .dot,.dot.breach{background:var(--red)}
.s-offline,.s-nodata{color:var(--slate)}.s-offline .dot,.s-nodata .dot{background:#aab3c2}
.bar{display:inline-block;width:90px;height:5px;border-radius:9px;background:var(--line);vertical-align:middle;margin-left:12px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--teal)}
.bar.near i{background:var(--amber)}.bar.breach i{background:var(--red)}
.red{color:var(--red)}.amber{color:var(--amber)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 16px;height:50px;width:440px;color:var(--slate)}
.search input{border:0;outline:0;background:none;flex:1;height:100%}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
/* forms */
label.f{display:block;font-size:14px;color:var(--slate);margin-bottom:8px}
.inp{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 16px;outline:0;font-size:16px}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px #4c9db033}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.err{color:var(--red);font-size:14px;margin-top:10px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.login .box{width:640px;max-width:92vw}
.login .logo{color:var(--navy);justify-content:center;font-size:30px;margin-bottom:46px}
.login .logo i{background:var(--navy);color:var(--bg);width:72px;height:72px;border-radius:20px}
.login .card{padding:56px}
.login h1{font-size:34px;margin-bottom:34px}
.pw{position:relative}.pw button{position:absolute;right:12px;top:12px;background:none;border:0;cursor:pointer;color:var(--slate)}
/* wizard */
.steps{display:flex;align-items:center;gap:16px;margin:30px 0 40px}
.step{display:flex;align-items:center;gap:14px;color:var(--slate);font-size:20px}
.step .c{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--slate)}
.step.on{color:var(--navy);font-weight:600}.step.on .c{background:var(--navy);color:#fff;border-color:var(--navy)}
.step.done .c{background:var(--teal-d);color:#fff;border-color:var(--teal-d)}
.steps .ln{flex:0 0 110px;height:1px;background:var(--line)}
.drop{border:2px dashed #e1cfae;border-radius:22px;background:var(--card);padding:70px 20px;text-align:center}
.drop.over{border-color:var(--teal);background:#f3f9fa}
.drop .ic{width:116px;height:116px;border-radius:30px;background:var(--teal-bg);display:grid;place-items:center;margin:0 auto 26px;color:var(--teal-d)}
.drop h2{font-size:30px;margin-bottom:10px}
.filecard{display:flex;align-items:center;gap:20px;padding:26px 36px;margin-bottom:26px}
.ftype{width:64px;height:78px;border-radius:12px;background:var(--teal-bg);color:var(--teal-d);display:grid;place-items:center;font-weight:700;font-size:15px;height:64px}
.ftype.pdf{background:var(--red-bg);color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:34px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:30px;cursor:pointer;display:flex;gap:16px;text-align:left}
.opt.on{border:2px solid var(--navy);padding:29px}
.opt .rd{flex:0 0 32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.opt.on .rd{border:2px solid var(--navy)}.opt.on .rd:after{content:"";width:16px;height:16px;border-radius:50%;background:var(--navy)}
.opt b{font-size:19px;display:block;margin-bottom:6px}.opt span{color:var(--slate);font-size:16px;line-height:1.5}
.info{background:var(--teal-bg);color:#14505f;border-radius:16px;padding:22px 30px;margin-bottom:30px}
.info.warn{background:var(--amber-bg);color:#7a5410}.info.bad{background:var(--red-bg);color:#8d0f19}
.info b{font-size:17px}.info code{background:#ffffff90;padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.foot{display:flex;justify-content:space-between;margin-top:34px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid var(--line);padding-top:30px;margin-top:34px}
.summary .l{color:var(--slate);font-size:15px;margin-bottom:6px}.summary .v{font-size:20px;font-weight:600}
/* deal */
.dealhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dealhead h1{font-size:40px}
.chartpanel{display:grid;grid-template-columns:1fr 340px;margin-bottom:30px}
.chartpanel>div{padding:34px}.chartpanel>div+div{border-left:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;background:#fff}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500}
.seg button.on{background:var(--navy);color:#fff}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:14px;margin:18px 0 6px;color:var(--slate)}
.legend i{display:inline-block;width:26px;height:0;border-top:3px solid;vertical-align:middle;margin-right:8px}
.legend i.hatch{height:12px;border:0;background:repeating-linear-gradient(135deg,var(--red) 0 2px,transparent 2px 5px);width:22px;vertical-align:-1px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 8px 24px #051f4524;font-size:14px;min-width:210px;display:none;z-index:5}
.tip b{display:block;margin-bottom:8px;font-size:15px}.tip div{display:flex;justify-content:space-between;gap:20px;line-height:1.7}
.banner{border-radius:14px;padding:16px 22px;margin-top:20px;background:var(--red-bg);color:#8d0f19}
.banner.ok{background:var(--teal-bg);color:#14505f}
.banner b{display:block}
.sl{margin-bottom:26px}.sl .t{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--slate)}.sl .t b{color:var(--navy);font-size:18px}
input[type=range]{width:100%;accent-color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.two>.card{padding:34px}
.mrow{margin:22px 0}.mrow .t{display:flex;justify-content:space-between;font-size:17px}.mrow .t small{color:#8a96a8;margin-left:8px}.mrow .t b{font-weight:600}
.mrow .bg{height:8px;border-radius:9px;background:var(--line);margin:8px 0 6px;overflow:hidden}.mrow .bg i{display:block;height:100%;background:#9fc9d4;border-radius:9px}
.mrow .d{font-size:13px;color:var(--slate)}
.kv{display:flex;justify-content:space-between;padding:6px 0}.kv.total{font-weight:700;font-size:19px;border-top:1px solid var(--line);margin-top:10px;padding-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}.stats .l{color:var(--slate);margin-bottom:10px}.stats .v{font-size:40px;font-weight:600}
.gpus{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding:18px 22px;background:#fbf0dd}
.gpu{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px}
.gpu b{display:block;font-size:17px;margin-bottom:6px;font-weight:600}.gpu.bad{border-color:var(--red);background:var(--red-bg)}.gpu.hot b{color:var(--red)}
.gpu small{display:block;color:var(--slate)}
.tgl{cursor:pointer}
/* notifications */
.nlist .item{display:grid;grid-template-columns:1fr 340px;gap:40px;padding:34px 48px;border-bottom:1px solid var(--line)}.nlist .item:last-child{border:0}
.nlist .item.dim{opacity:.55}
.kind{display:flex;align-items:center;gap:14px;font-size:15px;margin-bottom:12px;flex-wrap:wrap}.kind .t{color:#8a96a8}.kind .b{color:var(--slate)}
.nlist h3{margin:0 0 8px;font-size:22px;font-weight:600}
.nlist .acts{display:flex;flex-direction:column;gap:10px}
.nlist .btn{justify-content:center;width:100%}
.decided{background:var(--teal-bg);border-radius:14px;padding:18px 22px;color:#14505f}
/* market */
.mk{padding:34px 48px;margin-bottom:30px}
.mkrow{display:grid;grid-template-columns:160px 1fr 300px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);gap:20px}.mkrow:last-child{border:0}
.mkrow .nm{font-size:20px;font-weight:600}.warnl{color:var(--amber);font-size:15px;font-weight:500;margin-top:6px}
.rng{position:relative;height:60px}.rng .ax{position:absolute;left:0;right:0;top:34px;border-top:1px solid var(--line)}
.rng .sp{position:absolute;top:29px;height:12px;border-radius:9px;background:#bddbe3}.rng .sp.dash{background:repeating-linear-gradient(90deg,#bddbe3 0 8px,transparent 8px 12px)}
.rng .md{position:absolute;top:27px;width:16px;height:16px;border-radius:50%;background:var(--teal);margin-left:-8px}
.rng .wd{position:absolute;top:28px;width:13px;height:13px;border:2.5px solid var(--navy);background:#fff;transform:rotate(45deg);margin-left:-6px}
.rng .lb{position:absolute;top:2px;font-size:14px;color:var(--slate);transform:translateX(-50%)}
.lg{display:flex;gap:26px;color:var(--slate);font-size:15px;align-items:center}
.lg i{display:inline-block;margin-right:8px;vertical-align:middle}
/* misc */
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px}
.pill.low{background:var(--teal-bg);color:var(--teal-d)}.pill.medium{background:var(--amber-bg);color:var(--amber)}.pill.high{background:var(--red-bg);color:var(--red)}
.find{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}.find:last-child{border:0}
.find .sv{flex:0 0 10px;height:10px;border-radius:50%;margin-top:8px;background:var(--teal)}.find .sv.warning{background:var(--amber)}.find .sv.critical{background:var(--red)}
.find b{display:block}.find span{color:var(--slate);font-size:15px}
.chat{margin-top:22px}.chat .msgs{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{padding:12px 16px;border-radius:14px;max-width:82%;white-space:pre-wrap}.msg.u{background:var(--navy);color:#fff;align-self:flex-end}.msg.a{background:#fff;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:12px;cursor:pointer}
.modal{position:fixed;inset:0;background:#051f4580;display:grid;place-items:center;z-index:50}
.modal .card{padding:34px;width:520px;max-width:92vw}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--red)}
.loading{padding:80px;text-align:center;color:var(--slate)}
@media(max-width:1100px){.top{padding:0 20px;gap:14px}.hero,.stats,.summary{grid-template-columns:1fr 1fr}.chartpanel,.two,.nlist .item,.opts,.grid3{grid-template-columns:1fr}.gpus{grid-template-columns:repeat(4,1fr)}.mkrow{grid-template-columns:1fr}.search{width:100%}.chartpanel>div+div{border:0;border-top:1px solid var(--line)}}

@media(max-width:700px){.top{padding:0 12px;gap:6px;overflow-x:auto;height:54px}.logo span{display:none}.nav a{padding:0 9px;font-size:14px}.user>span:last-of-type{display:none}.top .icon-btn:nth-of-type(2){display:none}
main{padding:24px 16px 60px}h1{font-size:26px}.dealhead h1{font-size:28px}.head{flex-direction:column}.hero,.hero.three,.stats,.summary{grid-template-columns:1fr}.hero>div{border-left:0;border-top:1px solid #ffffff1c;padding:22px}.hero>div:first-child{border-top:0}.hero .v{font-size:34px}.hero .strip{padding:14px 22px}
.chartpanel>div,.two>.card,.mk,.card.filecard{padding:20px}.nlist .item{padding:22px}.row-between{flex-direction:column;align-items:stretch;gap:12px}.tabs{gap:18px;overflow-x:auto}.steps{flex-wrap:wrap;gap:10px}.steps .ln{display:none}.step{font-size:16px}.step .c{width:38px;height:38px}.gpus{grid-template-columns:repeat(2,1fr)}.login .card{padding:28px}.drop{padding:36px 14px}.drop h2{font-size:22px}.tip{min-width:170px}}
.chartpanel>div,.two>div,.two>.card,.grid2>div,.grid3>div,.stats>div,.summary>div,.hero>div,.nlist .item>div{min-width:0}
.chartbox,.chartbox svg{max-width:100%}
.tab,.tabs .end{white-space:nowrap;flex:none}

/* ===== v2: по ТЗ «Визуальная система» ===== */
:root{--green:#3E9C5F;--amber:#E0A31A;--amber-t:#9A6B07;--black:#111;--disabled:#9AA3B2}
body{color:var(--black)}
h1,h2,h3{color:var(--black)}
.s-ok{color:var(--green)}.s-ok .dot,.dot.ok{background:var(--green)}
.s-near{color:var(--amber-t)}.s-near .dot,.dot.near{background:var(--amber)}
.bar i{background:var(--green)}.bar.near i{background:var(--amber)}
.amber,.warnl{color:var(--amber-t)}
.btn{height:48px;border-radius:10px}.btn.sm{height:38px}
.btn[disabled]{background:var(--disabled);color:#fff;border-color:var(--disabled);opacity:1}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.lg{height:56px}
/* окна поверх страницы: ширина 600, затемнение, Esc/клик мимо */
.modal-ov{position:fixed;inset:0;background:#051f4573;display:grid;place-items:start center;overflow:auto;z-index:60;padding:6vh 16px}
.modal-box{background:var(--card);border-radius:18px;width:min(600px,100%);padding:30px 34px;box-shadow:0 20px 60px #051f4540;position:relative}
.modal-box.narrow{width:min(440px,100%)}
.modal-box h2{font-size:21px;margin:0 28px 4px 0}.modal-box .sub{font-size:14px;margin:0 0 20px}
.modal-x{position:absolute;right:16px;top:14px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--slate);width:34px;height:34px;border-radius:8px}
.modal-x:hover{background:var(--bg)}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.fld{margin-bottom:16px}.fld label{display:block;font-size:13px;color:var(--slate);margin-bottom:6px}
.fld .inp{height:46px;font-size:15px}
textarea.inp{height:auto;min-height:92px;padding:12px 16px;resize:vertical;line-height:1.45}
.inp.bad,.fld.bad .inp{border-color:var(--red)}

<script>/* ComputeCollateral — ядро интерфейса: утилиты, API, окна, шапка, маршрутизация, ошибки X01–X05 */
"use strict";
const $app = document.getElementById("app");

/* ---------- утилиты ---------- */

class ApiErr extends Error { constructor(m, status, data) { super(m); this.status = status; this.data = data || {}; this.code = (data || {}).code; } }
async function api(path, opts = {}) {
  if (window.CC_DEMO) return window.CC_DEMO(path, opts);

  if (opts.body !== undefined) {
    if (opts.body instanceof Blob) o.body = opts.body;
    else { o.body = JSON.stringify(opts.body); o.headers["Content-Type"] = "application/json"; }
  }
  let r;
  try { r = await fetch("/api" + path, o); } catch { throw new ApiErr("Нет связи с сервером", 0, { code: "network" }); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && path !== "/login") {

  document.body.appendChild(ov);
  const ctl = {
    el: ov, $: s => $(s, ov), $$: s => $$(s, ov),

    error(title2, text, retry) { $(".merr", ov).innerHTML = `<div class="err-box"><b>${esc(title2)}</b>${esc(text || "")}</div>`; if (retry) { const b = $(`[data-a="${retry}"]`, ov); if (b) { b.textContent = "Повторить"; b.disabled = false; } } },

}

const ICON = {

function shell(active, inner) {

<script>/* Портфель P01–P04 и рыночные данные M01–M02 */

async function viewMarket() {

    $("#mt").innerHTML = rowsOf().map(r => `<tr><td><b style="font-size:18px">${esc(r.model)}</b></td><td class="r num">${rub(r.median)}</td><td class="r num">${rub(r.world)}</td><td class="r num">${rub(r.rent)}</td><td class="r num">${Math.round(r.markup * 100)} %</td><td class="r num">${r.dealers}</td><td class="r num ${r.low_data ? "amber" : ""}"><b>±${Math.round(r.accuracy * 100)} %</b></td></tr>`).join("");

  <div class="card tblwrap"><table class="tbl"><thead><tr id="mh"><th>Модель</th>${[["median", "Медиана дилеров"], ["world", "Мировая цена"], ["rent", "Аренда за час"], ["markup", "Наценка импорта"], ["dealers", "Дилеров"], ["accuracy", "Точность"]].map(([k, t]) => `<th class="r" data-s="${k}" data-t="${t}" style="cursor:pointer">${t}</th>`).join("")}</tr></thead><tbody id="mt"></tbody></table></div>`);

<script>/* Новая оценка N01–N11: заёмщик → оборудование → телеметрия → параметры кредита → расчёт */
"use strict";
let WIZ = null;
const STEPS = ["Заёмщик", "Оборудование", "Телеметрия", "Параметры кредита"];
const FIELDS = [["name", "Название компании", "ООО «Название»"], ["inn", "ИНН", "10 или 12 цифр"], ["application", "Номер кредитной заявки", "КД-2026-0418"],
                ["location", "Где стоит оборудование", "ЦОД, город"], ["contact", "Контакт в ЦОД", "Имя и фамилия"], ["contact_email", "Почта контакта", "необязательно"]];
const formKey = () => "cc_wiz_form_" + (ME ? ME.email : "");
const newWiz = () => { let f = {}; try { f = JSON.parse(lsGet(formKey()) || "{}"); } catch { } return { step: 1, form: { name: "", inn: "", application: "", location: "", contact: "", contact_email: "", ...f }, force: false, dup: null, parsed: null, fileName: "", draft: null, mode: "agent", smi: null, agentSince: null, loan: { amount: 60000000, term: 36, rate: 18, schedule: "annuity", issue_date: new Date().toISOString().slice(0, 10), covenant: 1.25 }, excluded: false }; };

async function viewWizard() {
  if (!WIZ || WIZ.done) {
    WIZ = newWiz();
    const d = (await api("/draft")).draft;       // «Новая оценка» продолжает черновик с того же шага
    if (d) Object.assign(WIZ, { draft: d, step: d.step || 3, form: { name: d.borrower, inn: d.inn, application: d.application, location: d.location, contact: d.contact, contact_email: d.contact_email || "" }, mode: d.telemetry_mode || "agent",
      parsed: { servers: d.servers, cards: d.cards, count_servers: d.servers.length, errors: 0, rows: [], total: d.cards }, fileName: "перечень оборудования (черновик)" });
  }
  wizRender();
}
function wizHead() {
  const w = WIZ;
  return `<h1>Новая оценка</h1><div class="sub" style="font-size:18px">${w.form.name ? esc(w.form.name) + (w.form.inn ? ", ИНН " + esc(w.form.inn) : "") : "Новая сделка"}</div>
  <div class="steps">${STEPS.map((n, i) => `${i ? '<span class="ln"></span>' : ""}<div class="step ${w.step === i + 1 ? "on" : w.step > i + 1 ? "done" : ""}"><span class="c">${w.step > i + 1 ? ICON.check : i + 1}</span>${n}</div>`).join("")}</div>`;
}
function wizRender() { ({ 1: wizStep1, 2: wizStep2, 3: wizStep3, 4: wizStep4, 5: wizCalc })[WIZ.step](); }

/* ---- N01, N02 ---- */
function wizStep1() {
  const w = WIZ;
  render("new", `${wizHead()}<div class="card" style="padding:34px 40px" id="fm"><div class="grid2">${FIELDS.map(([k, t, ph]) => `<div class="fld"><label>${t}</label><input class="inp" name="${k}" value="${esc(w.form[k])}" placeholder="${ph}" autocomplete="off"></div>`).join("")}</div></div>
  <div id="dup"></div><div class="foot"><span></span><button class="btn primary" id="next">Далее</button></div>`);
  const fm = $("#fm");
  const check = () => {
    const f = w.form, errs = {};
    if (f.name.trim().length < 2 || f.name.length > 200) errs.name = "От 2 до 200 символов";
    if (!/^(\d{10}|\d{12})$/.test(f.inn.trim()) || !innOk(f.inn.trim())) errs.inn = "10 или 12 цифр, проверьте контрольную сумму";
    if (!/^(КД|KD)-\d{4}-\d{4}$/i.test(f.application.trim())) errs.application = "Формат КД-ГГГГ-NNNN, например КД-2026-0418";
    if (!f.location.trim()) errs.location = "Укажите, где стоит оборудование";
    if (!f.contact.trim()) errs.contact = "Укажите контакт в ЦОД";
    if (f.contact_email.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.contact_email.trim())) errs.contact_email = "Проверьте адрес почты";
    return errs;
  };
  const show = (errs, only) => { $$(".fld", fm).forEach(fl => { const n = $("input", fl).name; if (only && only !== n) return; fl.classList.toggle("bad", !!errs[n]); const m = $(".msg", fl); m && m.remove(); if (errs[n]) fl.insertAdjacentHTML("beforeend", `<div class="msg">${esc(errs[n])}</div>`); }); };
  fm.addEventListener("input", e => { w.form[e.target.name] = e.target.value; lsSet(formKey(), JSON.stringify(w.form)); if (e.target.name === "inn") dupCheck(); });
  fm.addEventListener("focusout", e => { if (e.target.name) show(check(), e.target.name); });
  async function dupCheck() {
    const inn = w.form.inn.trim(); w.dup = null; w.force = false; drawDup();
    if (!/^(\d{10}|\d{12})$/.test(inn) || !innOk(inn)) return;
    try { const r = await api("/check-inn?inn=" + inn); if (w.form.inn.trim() === inn) { w.dup = r.existing; drawDup(); } } catch { }
  }
  function drawDup() {
    const d = $("#dup"), nx = $("#next"); if (!d) return;
    if (w.dup && !w.force) { d.innerHTML = `<div class="banner-amber"><div><b>Компания с этим ИНН уже есть в портфеле</b>${esc(w.dup.borrower)}, сделка ${esc(w.dup.contract || "")}${w.dup.assessed ? ", оценка от " + w.dup.assessed : ""}</div><div class="row"><button class="btn sm" id="open">Открыть компанию</button><button class="btn sm primary" id="newdeal">Новая сделка для неё</button></div></div>`; nx.disabled = true;
      $("#open").onclick = async () => { if (w.draft) await api(`/deals/${w.draft.id}/discard`, { body: {} }).catch(() => { }); WIZ = null; location.hash = "#/deal/" + w.dup.id; };
      $("#newdeal").onclick = () => { w.force = true; drawDup(); }; }
    else { d.innerHTML = ""; nx.disabled = false; }
  }
  $("#next").onclick = () => { const errs = check(); show(errs); if (Object.keys(errs).length) return $(`[name="${Object.keys(errs)[0]}"]`, fm).focus(); w.step = 2; wizRender(); };
  if (innOk(w.form.inn.trim()) && /^(\d{10}|\d{12})$/.test(w.form.inn.trim())) dupCheck();
}
function innOk(inn) {
  const d = [...inn].map(Number), chk = ws => ws.reduce((a, w, i) => a + w * d[i], 0) % 11 % 10;
  if (inn.length === 10) return chk([2, 4, 10, 3, 5, 9, 4, 6, 8]) === d[9];
  if (inn.length === 12) return chk([7, 2, 4, 10, 3, 5, 9, 4, 6, 8]) === d[10] && chk([3, 7, 2, 4, 10, 3, 5, 9, 4, 6, 8]) === d[11];
  return false;
}

/* ---- N03, N04, N05 ---- */
function wizStep2() {
  const w = WIZ, p = w.parsed, bad = p ? p.errors : 0;
  let shown = 8;
  const fileCard = () => !p ? "" : `<div class="card filecard"><div class="ftype">${/xlsx?$/i.test(w.fileName) ? "XLSX" : "CSV"}</div><div style="flex:1"><div style="font-size:20px;font-weight:600">${esc(w.fileName)}</div><div class="muted" style="font-size:14px">${w.draft ? "" : "Загружен сейчас, "}<a href="#" id="repl">заменить</a></div></div>
    <div class="${bad && !w.excluded ? "red" : "ok-t"}"><i class="dot" style="background:currentColor"></i>${bad && !w.excluded ? `${bad} ${plural(bad, "строка", "строки", "строк")} из ${p.total} с ошибками` : `${p.cards} ${plural(p.cards, "карта", "карты", "карт")}, ${p.count_servers} ${plural(p.count_servers, "сервер", "сервера", "серверов")}, ${w.excluded ? "исключено строк: " + bad : "ошибок нет"}`}</div></div>`;
  const tableRows = () => {
    if (bad && !w.excluded) return p.rows.slice(0, 80).map(r => `<tr class="${r.ok ? "" : "row-bad"}"><td class="muted num">${r.line}</td><td>${esc(r.server)}</td><td>${esc(r.model)}</td><td class="num">${esc(r.serial)}</td><td class="num">${dmy(r.date)}</td><td>${r.ok ? '<span class="ok-t"><i class="dot ok"></i>Верно</span>' : `<span class="why">${esc(r.error)}</span>`}</td></tr>`).join("");
    const flat = p.servers.flatMap(s => s.gpus.map(g => ({ s: s.name, m: s.model, g })));
    return flat.slice(0, shown).map(r => `<tr><td><b>${esc(r.s)}</b></td><td>${esc(r.m)}</td><td class="num">${esc(r.g.serial)}</td><td class="num">${dmy(r.g.commissioned)}</td></tr>`).join("") + (flat.length > shown ? `<tr><td colspan="4" class="muted" style="cursor:pointer" id="more">Ещё ${flat.length - shown} ${plural(flat.length - shown, "строка", "строки", "строк")}</td></tr>` : "");
  };
  const tableHead = bad && !w.excluded ? "<th>Строка</th><th>Сервер</th><th>Модель</th><th>Серийный номер</th><th>Дата ввода</th><th>Проверка</th>" : "<th>Сервер</th><th>Модель</th><th>Серийный номер</th><th>Дата ввода</th>";
  render("new", `${wizHead()}
   ${!p ? `<div class="drop" id="drop"><div class="ic">${ICON.up}</div><h2>Загрузите список оборудования</h2><p class="muted" style="font-size:17px;margin:0 0 26px">Файл Excel или CSV от заёмщика, до 10 МБ, можно перетащить сюда</p>
     <button class="btn primary lg" id="pick" style="padding:0 40px">Загрузить файл</button><div id="ferr"></div><p class="muted" style="margin-top:26px">Нет файла у заёмщика? <a href="/api/template.xlsx">Скачать шаблон</a></p>${window.CC_DEMO ? '<p><button class="btn sm" id="sample">Загрузить пример файла</button></p>' : ""}</div>`
    : `${fileCard()}<div class="card tblwrap"><table class="tbl"><thead><tr>${tableHead}</tr></thead><tbody id="tb2">${tableRows()}</tbody></table></div>
      ${bad && !w.excluded ? `<div class="foot"><button class="btn" id="excl">Исключить ${bad} ${plural(bad, "строку", "строки", "строк")} и продолжить</button><button class="btn" disabled>Далее</button></div>` : ""}`}
   ${p && !(bad && !w.excluded) ? `<div class="foot"><button class="btn" id="back">Назад</button><button class="btn primary" id="next">Далее</button></div>` : !p ? `<div class="foot"><button class="btn" id="back">Назад</button><span></span></div>` : ""}<input type="file" id="fi" accept=".xlsx,.xlsm,.csv" hidden>`);
  const send = async f => {
    const fe = $("#ferr"); if (fe) fe.innerHTML = "";
    if (f.size > 10 * 1024 * 1024) return ferr("Файл больше 10 МБ");
    if (!/\.(xlsx|xlsm|csv)$/i.test(f.name)) return ferr("Нужен файл Excel (.xlsx) или CSV");
    try { w.parsed = await api("/parse-equipment", { body: f, headers: { "X-Filename": encodeURIComponent(f.name) } }); w.fileName = f.name; w.excluded = false; w.draft = null; wizRender(); }
    catch (e) { ferr(e.message); }
  };
  function ferr(m) { const fe = $("#ferr"); if (fe) fe.innerHTML = `<div class="err" style="margin-top:14px">${esc(m)}</div>`; else toast(m, true); }
  const pick = $("#pick"); if (pick) pick.onclick = () => $("#fi").click();
  const repl = $("#repl"); if (repl) repl.onclick = e => { e.preventDefault(); w.parsed = null; w.draft = null; wizRender(); };
  $("#fi").onchange = e => e.target.files[0] && send(e.target.files[0]);
  const sm = $("#sample"); if (sm) sm.onclick = () => send(new File([CC_DEMO_SAMPLES.template], "equipment_example.csv"));
  const dz = $("#drop"); if (dz) { dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); }; dz.ondragleave = () => dz.classList.remove("over"); dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); e.dataTransfer.files[0] && send(e.dataTransfer.files[0]); }; }
  const mr = $("#more"); if (mr) mr.onclick = () => { shown = 1e9; $("#tb2").innerHTML = tableRows(); };
  const ex = $("#excl"); if (ex) ex.onclick = () => { w.excluded = true; wizRender(); };
  const bk = $("#back"); if (bk) bk.onclick = () => { w.step = 1; wizRender(); };
  const nx = $("#next"); if (nx) nx.onclick = async () => {
    nx.disabled = true;
    try {
      if (!w.draft) { const f = w.form; const r = await api("/deals", { body: { name: f.name, inn: f.inn, application: f.application, location: f.location, contact: f.contact, contact_email: f.contact_email, servers: w.parsed.servers, force: w.force } }); w.draft = { id: r.id, agent_key: r.agent_key }; }
      w.step = 3; wizRender();
    } catch (e) { nx.disabled = false; if (e.status === 409) { w.dup = e.data.existing; w.step = 1; wizRender(); } else if (e.data && e.data.fields) { w.step = 1; wizRender(); setTimeout(() => toast("Проверьте данные заёмщика", true), 50); } else toast(e.message, true); }
  };
}

/* ---- N06, N07, N08 ---- */
function wizStep3() {
  const w = WIZ, id = w.draft.id;
  const opts = [["agent", "Агент на серверах", "Данные идут постоянно. После выдачи кредита банк видит, если оборудование заменили или отключили"], ["file", "Файл nvidia-smi", "Разовый снимок состояния карт. Наблюдать за залогом после выдачи нельзя"], ["none", "Без телеметрии", "Оценка с понижающей поправкой до 7 %, состояние карт неизвестно"]];
  render("new", `${wizHead()}<div class="opts">${opts.map(([k, t, d]) => `<div class="opt ${w.mode === k ? "on" : ""}" data-m="${k}"><span class="rd"></span><div><b>${t}</b><span>${d}</span></div></div>`).join("")}</div><div id="tp"></div>
  <div class="foot"><button class="btn" id="back">Назад</button><div class="row" id="nbar"></div></div><input type="file" id="fi" accept=".csv,.xlsx" hidden>`);
  $$(".opt").forEach(o => o.onclick = () => { w.mode = o.dataset.m; w.smi = null; wizStep3(); });
  $("#back").onclick = () => { w.step = 2; wizRender(); };
  const goNext = async () => { try { if (w.mode === "none") await api(`/deals/${id}/telemetry`, { body: { mode: "none" } }); await api(`/deals/${id}/step`, { body: { step: 4 } }); w.step = 4; wizRender(); } catch (e) { toast(e.message, true); } };
  const nbar = (btns) => { $("#nbar").innerHTML = btns; };
  const tp = $("#tp");
  if (w.mode === "agent") {
    api(`/deals/${id}/telemetry`, { body: { mode: "agent" } }).catch(() => { });
    w.agentSince = w.agentSince || Date.now();
    const key = w.draft.agent_key || "";
    const cmd = `python agent.py --server http://${location.host} --key ${key} --name <имя сервера из перечня>`;
    const refresh = async () => {
      if (!$("#tp")) return;
      let d; try { d = await api("/deals/" + id); } catch { return; }
      const S = d.servers, on = S.filter(s => s.online).length, total = S.length, waited = (Date.now() - w.agentSince) / 60000, partial = (on > 0 && on < total) || (on === 0 && waited >= 30);
      const rowsT = S.map(s => `<tr><td><b>${esc(s.name)}</b></td><td class="num">${s.online ? s.cards : 0}</td><td>${s.last_seen ? agoShort(s.last_seen) : "нет сигнала"}</td><td>${s.online ? sdot("ok", "На связи") : sdot("near", "Ждём сигнал")}</td></tr>`).join("");
      const demoBox = `<div class="muted" style="font-size:13px;margin-top:14px">Демонстрация без реальных серверов: <a href="#" id="dm1">подключить всех</a> · <a href="#" id="dm2">подключить часть (последние ${Math.max(1, Math.ceil(total / 2))} молчат)</a></div>`;
      tp.innerHTML = on === total && total > 0 ? `<div class="info" style="background:#e1f1e7;color:#1e5a37"><b><i class="dot ok"></i>Агент подключён: ${on} из ${total} ${plural(total, "сервера", "серверов", "серверов")} на связи</b><br>Данные получены по ${d.detail.equipment.seen} картам, серийные номера ${d.detail.equipment.matched === d.detail.equipment.total ? "совпадают с перечнем" : "совпадают у " + d.detail.equipment.matched + " из " + d.detail.equipment.total}</div>${d.detail.equipment.mismatches.length ? `<div class="banner-amber red"><div><b>Есть несовпадения серийных номеров: ${d.detail.equipment.mismatches.length}</b>После расчёта по сделке появится уведомление «Подмена оборудования»</div></div>` : ""}${gpuTable(S)}`
        : partial ? `<div class="banner-amber"><div><b>На связи ${on} из ${total} ${plural(total, "сервера", "серверов", "серверов")}</b>${S.filter(s => !s.online).map(s => esc(s.name)).join(" и ")} не отвечают${waited >= 1 ? " " + Math.round(waited) + " мин" : ""}. Их карты можно оценить с поправкой −7 %</div></div><div class="card tblwrap"><table class="tbl"><thead><tr><th>Сервер</th><th>Карт</th><th>Последний сигнал</th><th>Связь</th></tr></thead><tbody>${rowsT}</tbody></table></div>`
        : `<div class="card" style="padding:30px 36px"><h2 style="font-size:19px;margin-bottom:6px">Подключение агента</h2>
          <div class="num-step"><span class="n">1</span><div>Передайте ЦОДу ключ подключения<br><span class="keychip" style="margin-top:8px">${esc(key)}</span> <button class="btn sm" id="cp">Копировать</button></div></div>
          <div class="num-step"><span class="n">2</span><div style="flex:1;min-width:0">ЦОД запускает установку на каждом сервере<div class="cmd">${esc(cmd)}</div></div></div>
          <div class="num-step"><span class="n">3</span><div>Ждём первый сигнал: <b>${on} из ${total} ${plural(total, "сервера", "серверов", "серверов")}</b> <span class="spin"></span></div></div></div>`;
      tp.insertAdjacentHTML("beforeend", demoBox + (on === total && total > 0 ? "" : ""));
      nbar(`<button class="btn" id="inv">Отправить инструкцию в ЦОД</button>` + (partial ? `<button class="btn" id="again">Проверить снова</button><button class="btn primary" id="skip">Продолжить без них</button>` : `<button class="btn primary" id="next" ${on === total && total > 0 ? "" : "disabled"}>Далее</button>`));
      const cp = $("#cp"); if (cp) cp.onclick = () => { navigator.clipboard ? navigator.clipboard.writeText(key).then(() => toast("Скопировано")).catch(() => toast("Скопируйте ключ вручную: " + key)) : toast("Скопируйте ключ вручную: " + key); };
      $("#inv").onclick = async e => { e.target.disabled = true; try { const r = await api(`/deals/${id}/invite-cod`, { body: {} }); toast("Инструкция отправлена: " + r.to); } catch (er) { toast(er.message, true); } e.target.disabled = false; };
      const nx = $("#next"); if (nx) nx.onclick = goNext;
      const sk = $("#skip"); if (sk) sk.onclick = goNext;
      const ag = $("#again"); if (ag) ag.onclick = () => { refresh(); toast("Проверяем снова…"); };
      const d1 = $("#dm1"); if (d1) d1.onclick = async e => { e.preventDefault(); await api(`/deals/${id}/demo-agent`, { body: {} }); refresh(); };
      const d2 = $("#dm2"); if (d2) d2.onclick = async e => { e.preventDefault(); await api(`/deals/${id}/demo-agent`, { body: { silent: Math.max(1, Math.ceil(total / 2)) } }); refresh(); };
    };
    refresh(); POLL = setInterval(refresh, 4000);
  } else if (w.mode === "file") {
    const show = r => { tp.innerHTML = `<div class="info ${r.missing ? "warn" : ""}"><b>Снимок загружен: ${r.matched} из ${r.total} карт найдены по серийным номерам</b>${r.missing ? `<br>Не найдено в файле: ${r.missing}` : ""}${r.extra.length ? `<br>Лишние номера: ${r.extra.slice(0, 5).map(esc).join(", ")}${r.extra.length > 5 ? "…" : ""}` : ""}</div><button class="btn" id="pk">Заменить файл</button>`; $("#pk").onclick = () => $("#fi").click(); nbar(`<button class="btn primary" id="next">Далее</button>`); $("#next").onclick = goNext; };
    tp.innerHTML = `<div class="info"><b>Загрузите вывод nvidia-smi</b><br>Команда: <code>nvidia-smi --query-gpu=index,serial,name,temperature.gpu,utilization.gpu --format=csv &gt; smi.csv</code></div><button class="btn primary" id="pk">Выбрать файл</button>${window.CC_DEMO ? ' <button class="btn" id="smp">Загрузить пример снимка</button>' : ""}`;
    nbar(`<button class="btn primary" id="next" disabled>Далее</button>`);
    $("#pk").onclick = () => $("#fi").click();
    const upl = async f => { try { w.smi = await api(`/deals/${id}/telemetry-file`, { body: f, headers: { "X-Filename": encodeURIComponent(f.name) } }); show(w.smi); } catch (er) { toast(er.message, true); } };
    $("#fi").onchange = e => e.target.files[0] && upl(e.target.files[0]);
    const sm = $("#smp"); if (sm) sm.onclick = () => upl(new File([CC_DEMO_SAMPLES.smi(w.parsed.servers)], "smi_example.csv"));
    if (w.smi) show(w.smi);
  } else {
    tp.innerHTML = `<div class="info warn"><b>Состояние карт неизвестно</b><br>К рыночной стоимости применяется поправка 7 %, наблюдать за залогом после выдачи кредита будет нельзя.</div>`;
    nbar(`<button class="btn primary" id="next">Далее</button>`); $("#next").onclick = goNext;
  }
}
const agoShort = ts => { const m = Math.round((Date.now() / 1000 - ts) / 60); return m < 1 ? "только что" : m < 60 ? m + " мин назад" : Math.round(m / 60) + " ч назад"; };
function gpuTable(S) {
  const rows = S.flatMap(s => s.gpus.filter(g => g.temp != null).map(g => ({ s: s.name, g }))).slice(0, 5);
  const total = S.reduce((a, s) => a + s.gpus.filter(g => g.temp != null).length, 0);
  return `<div class="card tblwrap"><table class="tbl"><thead><tr><th>Сервер</th><th>Карта</th><th>Серийный номер</th><th class="r">Температура</th><th class="r">Загрузка</th><th class="r">Наработка</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(r.s)}</b></td><td>GPU ${r.g.idx}</td><td class="num">${esc(r.g.actual || r.g.serial)}</td><td class="r num">${r.g.temp} °C</td><td class="r num">${int(r.g.util)} %</td><td class="r num">${int(r.g.hours)} ч</td></tr>`).join("")}</tbody></table>${total > 5 ? `<div class="muted" style="padding:6px 24px 20px">Ещё ${total - 5} ${plural(total - 5, "карта", "карты", "карт")}</div>` : ""}</div>`;
}

/* ---- N09, N10 ---- */
function wizStep4() {
  const w = WIZ, l = w.loan, p = w.parsed;
  render("new", `${wizHead()}<div class="card" style="padding:36px 44px" id="lf"><div class="grid3">
   <div class="fld"><label>Сумма кредита, ₽</label><input class="inp" name="amount" inputmode="numeric" value="${l.amount}"></div>
   <div class="fld"><label>Срок, месяцев</label><input class="inp" name="term" inputmode="numeric" value="${l.term}"></div>
   <div class="fld"><label>Ставка, % годовых</label><input class="inp" name="rate" inputmode="decimal" value="${l.rate}"></div>
   <div class="fld"><label>График погашения</label><select class="inp" name="schedule"><option value="annuity" ${l.schedule === "annuity" ? "selected" : ""}>Аннуитетный</option><option value="differentiated" ${l.schedule === "differentiated" ? "selected" : ""}>Дифференцированный</option></select></div>
   <div class="fld"><label>Дата выдачи</label><input class="inp" name="issue_date" type="date" min="${new Date().toISOString().slice(0, 10)}" value="${l.issue_date}"></div>
   <div class="fld"><label>Ковенант покрытия</label><input class="inp" name="covenant" inputmode="decimal" value="${l.covenant}"></div></div></div>
  <div class="summary"><div><div class="l">Оборудование</div><div class="v">${p.cards} × ${esc(p.servers[0].model)}</div></div><div><div class="l">Где стоит</div><div class="v">${esc(w.form.location) || "—"}</div></div>
  <div><div class="l">Телеметрия</div><div class="v">${{ agent: "Агент на серверах", file: "Файл nvidia-smi", none: "Без телеметрии" }[w.mode]}</div></div><div><div class="l">Серийные номера</div><div class="v">${w.mode === "none" ? "не проверяются" : "сверяются с перечнем"}</div></div></div>
  <div class="foot"><button class="btn" id="back">Назад</button><button class="btn primary" id="go">Рассчитать оценку</button></div>`);
  const f = $("#lf"), num = v => parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
  const rules = { amount: [1e6, 5e8, "Введите сумму от 1 до 500 млн ₽"], term: [6, 60, "Срок от 6 до 60 месяцев"], rate: [1, 40, "Ставка от 1 до 40 % годовых"], covenant: [1, 2, "Ковенант от 1,00 до 2,00"] };
  const validate = () => {
    const errs = {};
    for (const [k, [lo, hi, msg]] of Object.entries(rules)) { const v = num($(`[name="${k}"]`, f).value); if (!(v >= lo && v <= hi)) errs[k] = msg; }
    const d = $('[name="issue_date"]', f).value; if (!d) errs.issue_date = "Укажите дату выдачи"; else if (d < new Date().toISOString().slice(0, 10)) errs.issue_date = "Дата не может быть раньше сегодняшней";
    return errs;
  };
  const paint = () => { const errs = validate(); fieldErrors(f, errs); $("#go").disabled = !!Object.keys(errs).length; return errs; };
  f.addEventListener("input", () => { Object.assign(l, { amount: num($('[name="amount"]', f).value), term: num($('[name="term"]', f).value), rate: num($('[name="rate"]', f).value), schedule: $('[name="schedule"]', f).value, issue_date: $('[name="issue_date"]', f).value, covenant: num($('[name="covenant"]', f).value) }); paint(); });
  paint();
  $("#back").onclick = () => { w.step = 3; wizRender(); };
  $("#go").onclick = async () => {
    if (Object.keys(paint()).length) return;
    $("#go").disabled = true;
    try { await api(`/deals/${w.draft.id}/loan`, { body: l }); w.step = 5; wizRender(); }
    catch (e) { $("#go").disabled = false; if (e.data && e.data.fields) fieldErrors(f, e.data.fields); else toast(e.message, true); }
  };
}

/* ---- N11: расчёт ---- */
function wizCalc() {
  const w = WIZ, id = w.draft.id;
  render("new", `<h1>Новая оценка</h1><div class="sub" style="font-size:18px">${esc(w.form.name)}, ИНН ${esc(w.form.inn)}</div><div class="steps">${STEPS.map((n, i) => `${i ? '<span class="ln"></span>' : ""}<div class="step done"><span class="c">${ICON.check}</span>${n}</div>`).join("")}</div>
  <div class="card calc" id="cc"><h2 style="font-size:22px">Считаем оценку</h2><p class="muted" style="margin:6px 0 0">Обычно до минуты. Можно уйти со страницы, придёт уведомление</p><div class="pb"><i style="width:3%"></i></div><ul id="cs"></ul></div>`);
  let fails = 0;
  const tick = async () => {
    if (!$("#cc")) return;
    try {
      const c = await api(`/deals/${id}/calc`);
      $(".pb i").style.width = Math.max(3, (c.done ? 1 : c.progress || 0) * 100) + "%";
      $("#cs").innerHTML = c.steps.map((t, i) => `<li class="${i < c.step || c.done ? "done" : i === c.step ? "cur" : ""}">${i < c.step || c.done ? '<span class="ok-t">' + ICON.check + "</span>" : i === c.step ? '<span class="spin"></span>' : '<span class="pt"></span>'}${esc(t)}</li>`).join("");
      if (c.done) { clearInterval(POLL); toast("Оценка готова"); const did = id; WIZ = null; lsSet(formKey(), "{}"); setTimeout(() => location.hash = "#/deal/" + did, 600); }
    } catch (e) { if (++fails >= 3) { clearInterval(POLL); setMain(`<div class="card calc"><h2>Не удалось рассчитать</h2><p class="muted">Данные шагов сохранены.</p><button class="btn primary" id="rt">Повторить</button></div>`); $("#rt").onclick = () => { w.step = 4; wizRender(); }; } }
  };
  tick(); POLL = setInterval(tick, 700);
}

<script>/* Компания: обзор C01–C06, оборудование E01–E05, документы D01–D04, ИИ-наблюдатель */
"use strict";
let DEAL_BANNER = null;
const SC = { opt: "Оптимистичный", base: "Базовый", pess: "Пессимистичный" };
function tickStep(v) { return v > 240e6 ? 100e6 : v > 120e6 ? 40e6 : v > 60e6 ? 20e6 : v > 30e6 ? 10e6 : 5e6; }
function niceMax(v) { const s = tickStep(v); return Math.ceil(v / s) * s; }

function chartSvg(fc, liquid, newgen) {
  const pts = fc.points, n = pts.length, W = 760, H = 330, ml = 46, mr = 10, mt = 10, mb = 34, iw = W - ml - mr, ih = H - mt - mb;
  const k = s => liquid ? s + "_liq" : s;
  const max = niceMax(Math.max(...pts.map(p => Math.max(p.opt, p.debt))) * 1.02);
  const x = i => ml + iw * i / Math.max(1, n - 1), y = v => mt + ih * (1 - v / max);
  const line = key => pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[key]).toFixed(1)).join(" ");
  let debt = "M" + x(0) + " " + y(pts[0].debt);
  pts.forEach((p, i) => { if (i) debt += ` H${x(i).toFixed(1)} V${y(p.debt).toFixed(1)}`; });
  const band = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[k("opt")]).toFixed(1)).join(" ") + " " + pts.slice().reverse().map((p, i) => "L" + x(n - 1 - i).toFixed(1) + " " + y(p[k("pess")]).toFixed(1)).join(" ") + "Z";
  let hatch = "";
  for (let i = 0; i < n - 1; i++) {
    const a = pts[i], b = pts[i + 1], da = a.debt - a[k("pess")], db = b.debt - b[k("pess")];
    if (da > 0 || db > 0) hatch += `<path d="M${x(i)} ${y(a.debt)} H${x(i + 1)} V${y(b[k("pess")])} L${x(i)} ${y(a[k("pess")])}Z" fill="url(#hat)"/>`;
  }
  const grid = []; for (let v = 0; v <= max + 1; v += tickStep(max)) grid.push(`<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="#EBDCC5" stroke-dasharray="${v ? "3 4" : ""}"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#3E4E68">${Math.round(v / 1e6)}</text>`);
  const lab = []; const stepL = Math.max(1, Math.round((n - 1) / 6));
  for (let i = 0; i < n; i += stepL) lab.push(`<text x="${Math.min(x(i), W - 22)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#3E4E68">${pts[i].date.slice(5, 7)}.${pts[i].date.slice(0, 4)}</text>`);
  const ng = newgen != null && newgen < n ? `<line x1="${x(newgen)}" x2="${x(newgen)}" y1="${mt}" y2="${mt + ih}" stroke="#C1121F" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/><text x="${x(newgen) + 6}" y="${mt + ih - 8}" font-size="12" fill="#3E4E68">новое поколение чипов</text>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" id="chart"><defs><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fbe1e3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#C1121F" stroke-width="2"/></pattern></defs>
   ${grid.join("")}<path d="${band}" fill="#4C9DB0" opacity=".13"/>${hatch}
   <path d="${line(k("opt"))}" fill="none" stroke="#9fc9d4" stroke-width="2"/><path d="${line(k("pess"))}" fill="none" stroke="#7b8799" stroke-width="2" stroke-dasharray="5 4"/>
   <path d="${line(k("base"))}" fill="none" stroke="#4C9DB0" stroke-width="3"/><path d="${debt}" fill="none" stroke="#051F45" stroke-width="2.5"/>${ng}${lab.join("")}
   <line id="cl" y1="${mt}" y2="${mt + ih}" stroke="#3E4E68" stroke-width="1" opacity="0"/><circle id="cd" r="5" fill="#4C9DB0" stroke="#fff" stroke-width="2" opacity="0"/></svg>`;
}
function bindChart(box, fc, liquid) {
  const svg = $("#chart", box), tip = $(".tip", box), pts = fc.points, n = pts.length, k = s => liquid ? s + "_liq" : s;
  const W = 760, ml = 46, mr = 10, iw = W - ml - mr;
  box.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - ml) / iw * (n - 1)))), p = pts[i];
    const cx = ml + iw * i / Math.max(1, n - 1);
    const max = niceMax(Math.max(...pts.map(q => Math.max(q.opt, q.debt))) * 1.02);
    $("#cl", box).setAttribute("x1", cx); $("#cl", box).setAttribute("x2", cx); $("#cl", box).setAttribute("opacity", 1);
    $("#cd", box).setAttribute("cx", cx); $("#cd", box).setAttribute("cy", 10 + 286 * (1 - p[k("base")] / max)); $("#cd", box).setAttribute("opacity", 1);
    tip.innerHTML = `<b>${dmy(p.date)}</b><div><span class="muted">Оптимистичный</span><span class="num">${mln(p[k("opt")])}</span></div><div><span class="muted">Базовый</span><span class="num">${mln(p[k("base")])}</span></div><div><span class="muted">Пессимистичный</span><span class="num">${mln(p[k("pess")])}</span></div><div><span class="muted">Остаток долга</span><span class="num">${mln(p.debt)}</span></div>`;
    tip.style.display = "block";
    const bx = box.getBoundingClientRect(); let left = e.clientX - bx.left + 16; if (left + 230 > bx.width) left = e.clientX - bx.left - 240;
    tip.style.left = left + "px"; tip.style.top = "30px";
  };
  box.onmouseleave = () => { tip.style.display = "none"; $("#cl", box).setAttribute("opacity", 0); $("#cd", box).setAttribute("opacity", 0); };
}

const dtime = ts => ts ? fd(ts) + " в " + ft(ts) : "—";
const hoursTxt = h => { const n = Math.round(h); return n + " " + plural(n, "час", "часа", "часов"); };

async function viewDeal(id, tab, query) {
  const D = await api("/deals/" + id);
  if (D.status === "draft") { location.hash = "#/new"; return; }
  if (D.status === "calculating") {
    render("portfolio", `<div class="center-msg"><h2>Идёт расчёт оценки</h2><p>${esc(D.borrower)}. Как только расчёт закончится, придёт уведомление «Оценка готова».</p><span class="spin"></span></div>`);
    POLL = setInterval(async () => { try { const c = await api(`/deals/${id}/calc`); if (c.done) { clearInterval(POLL); route(); } } catch { } }, 1500); return;
  }
  BADGE = ME.pending ?? BADGE;
  const T = { overview: () => overviewTab(D), equipment: () => equipmentTab(D, query), documents: () => documentsTab(D), ai: () => aiTab(D) }[tab] || (() => overviewTab(D));
  render("portfolio", dealHead(D, tab) + `<div id="dt"></div>`);
  bindHead(D);
  await T();
  if (PENDING_REASSESS === id && can("reassess")) { PENDING_REASSESS = null; reassessModal(D); }          // из уведомления «Назначить переоценку»
  if (PENDING_COD && PENDING_COD.id === id && tab === "equipment") { const s = PENDING_COD.server; PENDING_COD = null; codModal(D, s); }   // «Написать в ЦОД»
}
function dealHead(D, tab) {
  const st = D.detail.status, v = D.detail.valuation;
  return `<div class="crumbs"><a href="#/portfolio">Портфель залогов</a> / ${esc(D.borrower)}</div>
  <div class="head"><div><div class="dealhead"><h1>${esc(D.borrower)}</h1><span class="chip-st">${sdot(st, STATUS[st])}</span></div>
  <div class="sub">Сделка ${esc(D.contract)}, ${v.cards} × ${Object.keys(v.per_model).map(k => ({ H100: "H100 SXM 80 ГБ", H200: "H200", A100: "A100 80 ГБ", L40S: "L40S" }[k])).join(" + ")} в ${esc(D.location)}</div></div>
  <div class="row">${can("reassess") ? '<button class="btn" id="reass">Переоценить</button>' : ""}${can("export") ? `<button class="btn primary" id="exp">${ICON.down} Выгрузить заключение</button>` : ""}</div></div>
  <div class="tabs">${[["overview", "Обзор"], ["equipment", "Оборудование"], ["documents", "Документы"], ["ai", "ИИ-наблюдатель"]].map(([k, t]) => `<button class="tab ${tab === k ? "on" : ""}" data-tab="${k}">${t}</button>`).join("")}
  <button class="end" id="dalerts">${ICON.bell} Уведомления ${D.alerts ? `<span class="badge">${D.alerts}</span>` : ""}</button></div>`;
}
function bindHead(D) {
  $$("[data-tab]").forEach(b => b.onclick = () => location.hash = `#/deal/${D.id}/${b.dataset.tab}`);
  $("#dalerts").onclick = () => location.hash = "#/notifications?deal=" + D.id;

/* ---- C05, C06: переоценка ---- */
const STEPS_RE = ["Берём свежие цены дилеров и ставки аренды", "Сверяем серийные номера и данные агента", "Пересчитываем три метода оценки", "Строим прогноз и подбираем LTV"];
function reassessModal(D) {
  const m = modal({ title: "Переоценить залог", sub: `${D.borrower}, текущая оценка от ${D.assessed_at ? fd(D.assessed_at) : "—"}`, narrow: true,
    body: '<p style="margin:0 0 10px;font-size:14px">Возьмём свежие цены дилеров, ставки аренды и данные агента на сегодня. Условия кредита не изменятся.</p><p class="muted" style="margin:0;font-size:14px">Предыдущая оценка сохранится во вкладке «Документы».</p>',
    actions: [{ id: "c", label: "Отмена", onClick: c => c.close() }, { id: "ok", label: "Переоценить", primary: true, onClick: ctl => submitModal(ctl, "ok", async () => {
      $(".mbody", ctl.el).innerHTML = `<ul class="calc" style="padding:0;margin:0">${STEPS_RE.map((t, i) => `<li class="${i === 0 ? "cur" : ""}" id="rs${i}">${i === 0 ? '<span class="spin"></span>' : '<span class="pt"></span>'}${t}</li>`).join("")}</ul>`;
      ctl.btn("c").disabled = true; ctl.btn("ok").disabled = true;
      let i = 0; const anim = setInterval(() => { const li = $("#rs" + i); if (li) { li.className = "done"; li.firstChild.outerHTML = '<span class="ok-t">' + ICON.check + "</span>"; } i++; const nx = $("#rs" + i); if (nx) { nx.className = "cur"; nx.firstChild.outerHTML = '<span class="spin"></span>'; } }, 650);
      let r; try { [r] = await Promise.all([api(`/deals/${D.id}/reassess`, { body: {} }), new Promise(res => setTimeout(res, 2700))]); } finally { clearInterval(anim); }

const bannerHtml = D => {

};

    $("#banner").innerHTML = g ? `<div class="banner"><b><i class="dot breach"></i>В пессимистичном сценарии залог станет дешевле долга ${dmy(g.first_date)}</b>Через ${g.first_month} ${plural(g.first_month, "месяц", "месяца", "месяцев")}. Разрыв продлится ${g.months} ${plural(g.months, "месяц", "месяца", "месяцев")}, максимум ${nf(g.max_gap / 1e6, 1)} млн ₽</div>` : `<div class="banner ok"><b>В пессимистичном сценарии залог покрывает долг весь срок кредита</b></div>`;
    $("#h-ltv").textContent = nf(rec.ltv * 100, 1) + " %";
    $("#h-req").textContent = `Запрошено ${nf(rec.requested_ltv * 100, 1)} %, это ${nf(st.amount / 1e6, 1)} млн ₽`;
    $("#h-ex").innerHTML = rec.exceeds ? `<span style="color:#ff8a93"><i class="dot breach"></i>Выше рекомендации. Максимум ${nf(rec.max_loan / 1e6, 1)} млн ₽</span>` : `<span style="color:#7fd6a2"><i class="dot ok"></i>В пределах рекомендации, запас ${nf(rec.headroom / 1e6, 1)} млн ₽</span>`;
    $("#hy").innerHTML = wi.half_year.map(r => `<tr><td class="num">${dmy(r.date)}</td><td class="r num">${mln(r.debt)}</td><td class="r num ${covCls(r.base)}">${r.paid ? '<span class="muted">погашен</span>' : cov(r.base)}</td><td class="r num ${covCls(r.pess)}">${r.paid ? '<span class="muted">погашен</span>' : cov(r.pess)}</td></tr>`).join("");
    if (edit) { $("#v-a").textContent = mln(st.amount); $("#v-t").textContent = st.term + " мес."; $("#v-r").textContent = nf(st.rate, 1) + " %"; }
  };
  const recalc = () => { clearTimeout(t); t = setTimeout(async () => { try { st.wi = await api(`/deals/${D.id}/whatif`, { body: { amount: st.amount, term: st.term, rate: st.rate, scenario: st.scen, basis: st.liquid ? "liquidation" : "market" } }); draw(); } catch (e) { toast(e.message, true); } }, 120); };
  const save = () => { clearTimeout(saveT); saveT = setTimeout(async () => { const sv = $("#sv"); try { await api(`/deals/${D.id}/terms`, { body: { amount: st.amount, term: st.term, rate: st.rate } }); if (sv) sv.textContent = "Условия сохранены в сделке"; } catch (e) { if (sv) sv.textContent = ""; toast(e.message, true); } }, 700); };
  if (edit) [["r-a", "amount"], ["r-t", "term"], ["r-r", "rate"]].forEach(([i, k]) => $("#" + i).oninput = e => { st[k] = +e.target.value; $("#v-a").textContent = mln(st.amount); $("#v-t").textContent = st.term + " мес."; $("#v-r").textContent = nf(st.rate, 1) + " %"; $("#sv").textContent = ""; recalc(); save(); });
  $("#sc").onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; st.scen = b.dataset.s; $$("#sc button").forEach(x => x.classList.toggle("on", x === b)); recalc(); };
  $("#lq").onclick = e => { const b = e.target.closest("[data-l]"); if (!b) return; st.liquid = b.dataset.l === "1"; lsSet(BKEY, st.liquid ? "liq" : "mkt"); $$("#lq button").forEach(x => x.classList.toggle("on", x === b)); recalc(); };
  if (st.liquid) recalc(); else draw();
}

/* ---- E01–E05: оборудование ---- */
function equipmentTab(D, query) {
  const V = D.detail.valuation, S = D.servers, eq = D.detail.equipment, mism = eq.mismatches, silent = eq.silent || [], mode = D.telemetry_mode;
  const focusSrv = query.get("server"), focusSer = query.get("serial");
  let openIdx = focusSrv ? S.findIndex(s => s.name === focusSrv) : S.findIndex(s => s.matched < s.cards && s.seen);
  if (openIdx < 0) openIdx = 0;
  const models = Object.keys(V.per_model).join(", ");
  const avgH = S.filter(s => s.hours != null);
  const link = s => mode === "agent" ? (s.online ? sdot("ok", "На связи") : sdot("near", s.silent_hours != null ? "Нет связи " + hoursTxt(s.silent_hours) : "Нет сигнала")) : mode === "file" ? '<span class="muted">Снимок</span>' : '<span class="muted">—</span>';
  const bar = (v, max, cls = "") => v == null ? "" : `<span class="bar ${cls}" style="margin:0 12px 0 0"><i style="width:${Math.min(100, v / max * 100)}%"></i></span>`;
  const banners = mism.map(m => `<div class="banner-amber red"><div><b>Серийный номер GPU ${m.gpu} на ${esc(m.server)} не совпадает с договором</b>По договору s/n ${esc(m.contract)}, сейчас установлен ${esc(m.actual)}</div><a class="btn sm primary" href="#/notifications?deal=${D.id}">Открыть уведомление</a></div>`).join("")
    + silent.map(s => `<div class="banner-amber"><div><b>${esc(s.server)} не передаёт данные ${s.hours != null ? hoursTxt(s.hours) : ""}</b>Стоимость его ${s.cards} ${plural(s.cards, "карты", "карт", "карт")} снижена на 7 %, пока связь не восстановится</div>${can("write_cod") ? `<button class="btn sm" data-cod="${esc(s.server)}">Написать в ЦОД</button>` : ""}</div>`).join("");
  const rowsHtml = S.map((s, i) => {
    const swap = s.seen && s.matched < s.cards, sil = mode === "agent" && !s.online;
    const lastTxt = s.last_seen ? "Последние данные " + dtime(s.last_seen) : "Данных нет";
    return `<tr class="click ${swap ? "row-bad" : sil ? "row-yel" : ""}" data-tg="${i}"><td><div class="name">${esc(s.name)}</div><div class="sm">${s.cards} × ${esc(s.model)} SXM</div></td>
     <td>${sil ? '<span class="muted">нет данных</span>' : s.seen ? `<span class="${swap ? "s-breach" : "ok-t"}"><i class="dot" style="background:currentColor"></i>${s.matched} из ${s.cards} совпадают</span>` : '<span class="muted">не проверялись</span>'}</td>
     ${sil ? `<td colspan="3" style="color:var(--amber-t)">${lastTxt}</td>` : `<td class="r num">${s.hours != null ? int(s.hours) + " ч" : "—"}</td><td class="num">${bar(s.util, 100)}${s.util != null ? s.util + " %" : "—"}</td><td class="num">${bar(s.temp, 100, s.temp >= 80 ? "breach" : "")}${s.temp != null ? s.temp + " °C" : "—"}</td>`}
     <td class="r num">${s.wear != null ? "−" + nf(s.wear * 100, 1) + " %" : "—"}</td><td>${link(s)}</td></tr>
     <tr id="g${i}" ${i === openIdx ? "" : "hidden"}><td colspan="7" style="padding:0"><div class="gpus">${s.gpus.map(g => `<div class="gpu ${g.match === false ? "bad" : ""} ${g.temp >= 80 ? "hot" : ""} ${focusSer && g.serial === focusSer ? "sel" : ""}"><b>GPU ${g.idx}</b>${g.temp != null ? `<small>${g.temp} °C · ${int(g.util)} %</small>` : ""}<small class="num">…${esc(String(g.actual || g.serial).slice(-5))}</small>${g.match === false ? '<small class="red">чужая</small>' : ""}</div>`).join("")}</div></td></tr>`;
  }).join("");
  $("#dt").innerHTML = `${banners}<div class="stats"><div><div class="l">Серверов</div><div class="v">${S.length}</div></div><div><div class="l">Карт ${esc(models)}</div><div class="v">${V.cards}</div></div>
  <div><div class="l">На связи</div><div class="v num" style="${mode === "agent" && eq.online < S.length ? "color:var(--amber-t)" : ""}">${mode === "agent" ? `${eq.online} из ${S.length}` : "—"}</div></div><div><div class="l">Поправка за износ</div><div class="v num">−${nf(V.wear * 100, 1)} %</div></div></div>
  <div class="card tblwrap"><table class="tbl"><thead><tr><th>Сервер</th><th>Серийные номера</th><th class="r">Наработка</th><th>Загрузка</th><th>Температура</th><th class="r">Поправка</th><th>Связь</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
  $("#dt").onclick = e => {
    const c = e.target.closest("[data-cod]"); if (c) return codModal(D, c.dataset.cod);
    const r = e.target.closest("[data-tg]"); if (!r) return; const x = $("#g" + r.dataset.tg); const was = !x.hidden;
    $$('[id^="g"]', $("#dt")).forEach(y => { if (/^g\d+$/.test(y.id)) y.hidden = true; }); x.hidden = was;   // раскрыт один сервер за раз
  };
}
/* E05: письмо в ЦОД */
function codModal(D, srv) {
  const s = D.servers.find(x => x.name === srv) || {};
  const m = modal({ title: "Написать в ЦОД", sub: "Письмо уйдёт с вашей рабочей почты",
    body: `<div class="fld"><label>Кому</label><input class="inp" id="to" readonly value="${esc((D.contact || "") + (D.contact_email ? ", " + D.contact_email : ""))}"></div>
      <div class="fld"><label>Тема</label><input class="inp" id="sj" value="Сервер ${esc(srv)} не передаёт данные"></div>
      <div class="fld"><label>Сообщение</label><textarea class="inp" id="ms">Здравствуйте! ${s.last_seen ? "С " + dtime(s.last_seen) + " " : ""}сервер ${esc(srv)} не передаёт данные агенту. Проверьте, пожалуйста, питание и сеть сервера.</textarea></div>`,
    actions: [{ id: "c", label: "Отмена", onClick: c => c.close() }, { id: "ok", label: "Отправить", primary: true, onClick: ctl => submitModal(ctl, "ok", async () => { const r = await api(`/deals/${D.id}/write-cod`, { body: { subject: $("#sj", ctl.el).value, message: $("#ms", ctl.el).value } }); ctl.close(); toast("Письмо отправлено: " + r.to); }) }] });

/* ---- D01, D03, D04: документы ---- */
async function documentsTab(D) {
  let docs = await api(`/deals/${D.id}/documents`), f = "all";
  const tabs = [["all", "Все"], ["conclusion", "Заключения"], ["contract", "Договоры"], ["data", "Данные"], ["act", "Акты"]];
  const ICOLS = { pdf: "pdf", html: "pdf" };
  const draw = () => {
    const list = docs.filter(d => f === "all" || d.type === f);
    $("#dt").innerHTML = docs.length === 0 ? `<div class="card center-msg"><h2>Документов пока нет</h2><p>Заключение появится здесь после первой выгрузки. Договоры и акты можно загрузить вручную</p>${can("upload_docs") ? '<button class="btn primary" id="up">Загрузить документ</button>' : ""}</div>` :
    `<div class="row-between"><div class="tabs plain" style="margin:0" id="dtabs">${tabs.map(([k, t]) => `<button class="tab ${f === k ? "on" : ""}" data-f="${k}">${t}<small>${k === "all" ? docs.length : docs.filter(d => d.type === k).length}</small></button>`).join("")}</div>${can("upload_docs") ? `<button class="btn" id="up">${ICON.up.replace('width="44" height="44"', 'width="18" height="18"')} Загрузить документ</button>` : ""}</div>
    <div class="card tblwrap"><table class="tbl"><thead><tr><th>Документ</th><th>Тип</th><th>Дата</th><th>Добавил</th><th></th></tr></thead><tbody>${list.map(d => `<tr><td><div class="row"><span class="ftype ${ICOLS[d.ext] ? "pdf" : ""}" style="width:56px;height:56px;font-size:13px">${esc((d.ext || "file").toUpperCase())}</span><div><a href="/api/deals/${D.id}/documents/${d.id}?inline=1" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><b style="font-size:17px;font-weight:600">${esc(d.name)}</b></a>${d.comment ? `<div class="muted" style="font-size:13px">${esc(d.comment)}</div>` : ""}</div></div></td><td>${esc(d.type_label)}</td><td class="num">${esc(d.date)}</td><td>${esc(d.author)}</td><td class="r"><a href="/api/deals/${D.id}/documents/${d.id}" download>Скачать</a></td></tr>`).join("") || '<tr><td colspan="5" class="muted" style="text-align:center;padding:40px">Документов этого типа нет</td></tr>'}</tbody></table></div>`;
    const dt = $("#dtabs"); if (dt) dt.onclick = e => { const b = e.target.closest("[data-f]"); if (b) { f = b.dataset.f; draw(); } };
    const up = $("#up"); if (up) up.onclick = () => uploadModal(D, async () => { docs = await api(`/deals/${D.id}/documents`); draw(); });
  };
  draw();
}
function uploadModal(D, done) {
  let file = null;
  const m = modal({ title: "Загрузить документ", sub: `${D.borrower}, сделка ${D.contract}`, narrow: true,
    body: `<div class="fld"><label>Тип документа</label><select class="inp" id="dty"><option value="contract">Договор</option><option value="act">Акт осмотра</option><option value="conclusion">Заключение</option><option value="other">Другое</option></select></div>
      <div class="fld" id="fl"><label>Файл</label><div class="drop" id="dz" style="padding:20px;border-radius:12px"><div id="fn" class="muted">PDF, Word, Excel, JPG или PNG до 20 МБ</div><button class="btn sm" id="pk" type="button" style="margin-top:10px">Выбрать файл</button></div></div>
      <div class="fld"><label>Комментарий, необязательно</label><input class="inp" id="cm" maxlength="200"></div><input type="file" id="fx" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" hidden>`,
    actions: [{ id: "c", label: "Отмена", onClick: c => c.close() }, { id: "ok", label: "Загрузить", primary: true, onClick: ctl => submitModal(ctl, "ok", async () => {
      if (!file) { ctl.error("Выберите файл", "Нужен PDF, Word, Excel, JPG или PNG до 20 МБ."); ctl.btn("ok").disabled = false; return; }
      if (file.size > 20 * 1024 * 1024) { ctl.error("Файл больше 20 МБ", ""); ctl.btn("ok").disabled = false; return; }
      await api(`/deals/${D.id}/documents`, { body: file, headers: { "X-Filename": encodeURIComponent(file.name), "X-Doc-Type": $("#dty", ctl.el).value, "X-Comment": encodeURIComponent($("#cm", ctl.el).value) } });
      ctl.close(); toast("Документ загружен"); done();
    }) }] });
  const pick = f => { file = f; $("#fn", m.el).innerHTML = `<b>${esc(f.name)}</b> · ${nf(f.size / 1048576, 1)} МБ`; m.clearError(); };
  $("#pk", m.el).onclick = () => $("#fx", m.el).click(); $("#fx", m.el).onchange = e => e.target.files[0] && pick(e.target.files[0]);
  const dz = $("#dz", m.el); dz.ondragover = e => e.preventDefault(); dz.ondrop = e => { e.preventDefault(); e.dataTransfer.files[0] && pick(e.dataTransfer.files[0]); };
}

/* ---- ИИ-наблюдатель ---- */
function aiTab(D) {
  const el = $("#dt"), id = D.id, RISK = { low: "Низкий риск", medium: "Средний риск", high: "Высокий риск" };
  const draw = r => {
    el.innerHTML = `<div class="two"><div class="card"><div class="row-between"><h2>Анализ ИИ-наблюдателя</h2><button class="btn primary sm" id="run">Запустить анализ</button></div>
      <p class="muted" style="font-size:13px;margin:-8px 0 14px">Справочная подсказка. На стоимость залога, статусы и решения по сделке не влияет: решения принимает сотрудник банка.</p>
      ${r ? `<div class="row" style="margin-bottom:12px"><span class="pill ${r.risk}">${RISK[r.risk]}</span><span class="muted" style="font-size:14px">${r.source === "ai" ? "модель " + esc(r.model) : "правила (ИИ не подключён)"} · ${fdt(r.ts)}</span></div><p style="margin:0 0 14px;font-size:17px">${esc(r.summary)}</p>
      ${r.ai_error ? `<div class="info warn" style="padding:12px 16px;font-size:14px">ИИ недоступен: ${esc(r.ai_error)}. Показаны результаты правил.</div>` : ""}
      ${r.findings.map(x => `<div class="find"><span class="sv ${x.severity}"></span><div><b>${esc(x.title)}${x.server ? ` — ${esc(x.server)}${x.gpu != null ? ", GPU " + x.gpu : ""}` : ""}</b><span>${esc(x.detail || "")}</span></div></div>`).join("") || '<p class="muted">Замечаний нет.</p>'}
      ${r.recommendations?.length ? `<h2 style="font-size:17px;margin:20px 0 6px">Рекомендации</h2><ul style="margin:0;padding-left:20px">${r.recommendations.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}` : `<p class="muted">Анализ ещё не запускался.</p>`}
      ${D.ai_ready ? "" : `<div class="info warn" style="margin:20px 0 0;padding:14px 18px;font-size:14px">Подключите модель в <a href="#/settings">настройках</a> — она будет разбирать телеметрию вместе с правилами.</div>`}</div>
     <div class="card" style="padding:34px"><h2>Спросить ИИ о сделке</h2><div class="chat"><div class="msgs" id="msgs"><div class="msg a">Задайте вопрос по залогу: например, «какие серверы вызывают опасения?» или «что будет с покрытием через год?»</div></div>
      <div class="row"><input class="inp" id="qq" placeholder="Ваш вопрос" style="flex:1"><button class="btn primary" id="ask">Спросить</button></div></div>
      ${can("reassess") ? `<h2 style="font-size:17px;margin:34px 0 8px">Демонстрация инцидентов</h2><p class="muted" style="font-size:14px;margin:0 0 12px">Имитирует событие на серверах заёмщика — мониторинг создаст уведомление, ИИ проанализирует ситуацию.</p>
      <div class="row">${[["overheat", "Перегрев"], ["swap", "Подмена карты"], ["offline", "Обрыв связи"], ["reset", "Сбросить"]].map(([k, t]) => `<button class="btn sm" data-inc="${k}">${t}</button>`).join("")}</div>` : ""}</div></div>`;
    $("#run").onclick = async e => { e.target.disabled = true; e.target.textContent = "Анализируем…"; try { draw(await api(`/deals/${id}/ai-analyze`, { body: {} })); } catch (er) { toast(er.message, true); e.target.disabled = false; e.target.textContent = "Запустить анализ"; } };
    const msgs = $("#msgs"), say = (c, t) => { const d = document.createElement("div"); d.className = "msg " + c; d.textContent = t; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; };
    const ask = async () => { const q = $("#qq").value.trim(); if (!q) return; $("#qq").value = ""; say("u", q); const w = say("a", "…"); try { w.textContent = (await api(`/deals/${id}/ai-chat`, { body: { question: q } })).answer; } catch (e) { w.textContent = e.message; } };
    $("#ask").onclick = ask; $("#qq").onkeydown = e => e.key === "Enter" && ask();
    $$("[data-inc]").forEach(b => b.onclick = async () => { try { await api(`/deals/${id}/incident`, { body: { type: b.dataset.inc } }); toast("Готово — смотрите «Уведомления» и запустите анализ"); } catch (e) { toast(e.message, true); } });
  };
  draw(D.ai_report);
}
</script>
<script>/* Уведомления U01–U07 и настройки U08, подключение ИИ */
"use strict";
let PENDING_REASSESS = null, PENDING_COD = null;
const GROUP = { swap: "swap", covenant: "cov", threshold: "cov", forecast: "forecast", link: "link", hardware: "hw", ready: "ready" };
const GLABEL = { swap: "Подмена", cov: "Ковенанты", forecast: "Прогноз", link: "Связь", hw: "Оборудование", ready: "Готово" };
const SEV = { high: "breach", medium: "near", low: "offline" };

async function viewNotifications(query) {
  const dealFilter = query.get("deal");
  let list = await api("/notifications"), f = query.get("f") || "all";
  if (dealFilter) list = list.filter(n => n.deal_id === dealFilter);
  const open = n => n.status === "new" || n.status === "in_work";
  const reload = async () => { list = await api("/notifications"); if (dealFilter) list = list.filter(n => n.deal_id === dealFilter); draw(); refreshBadge(); };
  const kinds = ["swap", "cov", "forecast", "link"].concat([...new Set(list.map(n => GROUP[n.kind]))].filter(k => !["swap", "cov", "forecast", "link"].includes(k)));
  const draw = () => {
    const vis = list.filter(n => f === "all" || (f === "wait" ? open(n) : GROUP[n.kind] === f)), waiting = list.filter(open).length;
    $("#sub").textContent = waiting ? `${waiting} ждут решения` : "Ничего не ждёт решения";
    $("#nt").innerHTML = `<button class="tab ${f === "all" ? "on" : ""}" data-f="all">Все<small>${list.length}</small></button><button class="tab ${f === "wait" ? "on" : ""}" data-f="wait">Ждут решения<small>${waiting}</small></button>` + kinds.map(k => `<button class="tab ${f === k ? "on" : ""}" data-f="${k}">${GLABEL[k]}<small>${list.filter(n => GROUP[n.kind] === k).length}</small></button>`).join("");
    $("#nl").innerHTML = vis.length === 0 ? `<div class="center-msg"><div class="ic-ok">${ICON.check.replace('width="20" height="20"', 'width="30" height="30"')}</div><h2>${f === "wait" || waiting === 0 ? "Всё разобрано" : "Уведомлений нет"}</h2><p>${f === "wait" || waiting === 0 ? "Новых событий, которые ждут решения, нет" : "В этом разделе пока ничего нет"}</p></div>` :
      vis.map(n => `<div class="item ${n.status === "closed" ? "dim" : ""}"><div><div class="kind"><span class="s-${SEV[n.severity]}"><i class="dot"></i>${esc(n.kind === "swap" ? "Подмена оборудования" : n.label)}</span><a class="b" href="#/deal/${n.deal_id}" style="text-decoration:none">${esc(n.borrower)}</a><span class="t num">${fdt(n.ts)}</span></div>
        <h3>${esc(n.title)}</h3><div style="font-size:17px">${esc(n.text)}</div><div class="muted" style="margin-top:14px;font-size:14px">${esc(n.meta)}</div></div>
        <div>${right(n)}</div></div>`).join("");
    $$("[data-n]").forEach(b => b.onclick = () => onAction(list.find(x => x.id === b.dataset.n), b.dataset.a));
  };
  const right = n => {
