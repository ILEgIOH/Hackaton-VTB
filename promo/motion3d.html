<!doctype html><html lang="ru"><meta charset="utf-8"><title>ComputeCollateral 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f4b;--teal:#4aa3b8;--amber:#f1b95b;--red:#e8484f;--cream:#fff4e0}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07163a;font-family:Manrope,system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(1000px 700px at 78% 8%,#1f55b455,transparent),radial-gradient(800px 600px at 8% 100%,#4aa3b83a,transparent),linear-gradient(#07163a,#0b2257)}
.floor{position:absolute;left:-60%;width:220%;bottom:-420px;height:1500px;transform:perspective(900px) rotateX(74deg);
 background-image:linear-gradient(#4aa3b855 2px,transparent 2px),linear-gradient(90deg,#4aa3b855 2px,transparent 2px);background-size:110px 110px;
 -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%);animation:grid 3s linear infinite}
@keyframes grid{to{background-position:0 110px}}
.scene{position:absolute;inset:0;opacity:0;perspective:2000px;perspective-origin:50% 40%}
.cam{position:absolute;inset:0;transform-style:preserve-3d;transform:var(--c0);animation:camk var(--cd) cubic-bezier(.35,.1,.25,1) var(--cs) both}
@keyframes camk{from{transform:var(--c0)}to{transform:var(--c1)}}
.abs{position:absolute;transform-style:preserve-3d}
.t{position:absolute;text-align:center;left:0;right:0}
h1{font-size:104px;font-weight:800;line-height:1.06;letter-spacing:-2px}
h2{font-size:78px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.sub{font-size:38px;font-weight:600;opacity:.85}
.hl{color:var(--amber)}.redt{color:var(--red)}.teal{color:var(--teal)}
.a{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(60px) translateZ(-120px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotateY(-80deg)}70%{transform:scale(1.06) rotateY(6deg)}100%{opacity:1;transform:none}}
@keyframes pop3{0%{transform:scale(.001) rotateY(-80deg)}70%{transform:scale(1.06) rotateY(6deg)}100%{transform:none}}
@keyframes fin{to{opacity:1}}@keyframes fout{to{opacity:0}}
@keyframes growY{from{transform:scaleY(.001)}to{transform:scaleY(1)}}
@keyframes spinY{from{transform:rotateY(var(--r0))}to{transform:rotateY(var(--r1))}}
@keyframes flipin{from{transform:rotateX(-80deg) translateZ(-200px) scale(.001)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes flow{from{background-position:0 0}to{background-position:60px 0}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
.face{position:absolute;backface-visibility:hidden;overflow:hidden}
.chip{background:#ffffff18;border:2px solid #ffffff38;border-radius:22px;padding:22px 34px;font-size:34px;font-weight:600}
.kpi{padding:30px 40px;text-align:left;color:var(--navy);background:linear-gradient(#fff,#f1ebde);height:100%}
.kpi small{font-size:26px;opacity:.65;font-weight:700}.kpi b{display:block;font-size:72px;font-weight:800;margin-top:4px;letter-spacing:-2px}
.alert{display:flex;gap:20px;align-items:center;padding:0 44px;height:100%;font-size:36px;font-weight:800;color:#8d1b22;background:#fde6e7;border:4px solid var(--red)}
.alert i{width:22px;height:22px;border-radius:50%;background:var(--red);flex:none}
.logo{display:flex;align-items:center;gap:26px;font-size:100px;font-weight:800;letter-spacing:-2px;justify-content:center}.logo span{font-weight:400}
.mark{width:130px;height:130px;border-radius:32px;background:var(--cream);display:grid;place-items:center;color:var(--navy);font-size:80px}
.node{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;font-size:30px;font-weight:800;text-align:center;background:linear-gradient(#1d3f86,#142d68);border:2px solid #ffffff44;padding:12px}
.node i{font-style:normal;font-size:84px}
.beam{height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,#4aa3b8 0 24px,#9be3f2 24px 36px);background-size:60px 10px;animation:flow .7s linear infinite;box-shadow:0 0 30px #4aa3b8}
</style>
<body>
<div class="bg"></div><div class="floor"></div>

<!-- S1 0-3.3 -->
<section class="scene" data-from="0" data-to="4.65"><div class="cam" style="--c0:rotateY(-10deg) translateZ(-200px);--c1:rotateY(6deg) translateZ(40px);--cd:4.65s;--cs:0s">
  <div class="t" style="left:120px;right:auto;width:1000px;text-align:left;top:330px;transform:translateZ(60px)">
    <h1 class="a" data-at=".4" data-an="rise">GPU-серверы —<br><span class="hl">крутое<br>нововведение</span></h1>
  </div>
  <div class="t" style="left:120px;right:auto;width:1000px;text-align:left;top:790px;display:flex;gap:20px">
    <div class="chip a" data-at="2.2" data-an="pop">📉 Дешевеют</div><div class="chip a" data-at="2.8" data-an="pop">🔁 Подмена</div><div class="chip a" data-at="3.4" data-an="pop">🌐 У заёмщика</div></div>
  <div id="rack" class="abs" style="left:1400px;top:560px"></div>
</div></section>

<!-- S2 3.4-6.5 -->
<section class="scene" data-from="4.55" data-to="12.2"><div class="cam" style="--c0:rotateX(26deg) rotateY(40deg) translateZ(-200px);--c1:rotateX(22deg) rotateY(20deg) translateZ(30px);--cd:7.65s;--cs:4.55s">
  <div class="t" style="top:90px"><h2 class="a" data-at="8.6" data-an="rise">Но залог дешевеет —<br><span class="redt">долг остаётся</span></h2></div>
  <div id="bars" class="abs" style="left:960px;top:880px"></div>
</div></section>

<!-- S3 6.6-10.3 -->
<section class="scene" data-from="12.15" data-to="15.7"><div class="cam" style="--c0:rotateX(8deg) rotateY(34deg) translateZ(-250px);--c1:rotateX(8deg) rotateY(14deg) translateZ(40px);--cd:3.55s;--cs:12.15s">
  <div class="t" style="top:110px"><div class="logo a" data-at="12.2" data-an="rise"><div class="mark">⛨</div><div><b>Compute</b><span>Collateral</span></div></div>
   <p class="sub a" data-at="12.9" data-an="rise" style="margin-top:22px">Мониторинг залога в реальном времени</p></div>
  <div id="nodes" class="abs" style="left:960px;top:700px"></div>
</div></section>

<!-- S4 10.4-13.4 -->
<section class="scene" data-from="15.55" data-to="18.45"><div class="cam" style="--c0:rotateX(8deg) rotateY(-26deg) translateZ(-200px);--c1:rotateX(6deg) rotateY(-10deg) translateZ(20px);--cd:2.9s;--cs:15.55s">
  <div class="t" style="top:100px"><h2 class="a" data-at="15.6" data-an="rise">Банк видит <span class="teal">покрытие</span><br>и подмену оборудования</h2></div>
  <div id="kpis" class="abs" style="left:960px;top:520px"></div>
</div></section>

<!-- S5 13.5-15.4 -->
<section class="scene" data-from="18.3" data-to="99"><div class="cam" style="--c0:rotateX(6deg) translateZ(-300px);--c1:rotateX(0deg) translateZ(0px);--cd:3.5s;--cs:18.3s">
  <div id="logo3d" class="abs" style="left:960px;top:430px"></div>
  <div class="t" style="top:700px"><h2 class="a" data-at="19.0" data-an="rise" style="font-size:72px">Залог <span class="hl">под контролем</span></h2></div>
</div></section>

<script>
const $$=(s,f)=>document.querySelectorAll(s).forEach(f);
function box(w,h,d,c,front='',o={}){ // anchor at base centre; c=[front,side,top]
  const e=document.createElement('div');e.className='abs';e.style.cssText='left:0;top:0;width:0;height:0';
  const F=(W,H,tf,bg,html='')=>{const f=document.createElement('div');f.className='face';f.style.cssText=`width:${W}px;height:${H}px;left:${-W/2}px;top:${-H/2}px;background:${bg};transform:translateY(${-h/2}px) ${tf}`;f.innerHTML=html;e.appendChild(f)};
  F(w,h,`translateZ(${d/2}px)`,c[0],front);F(w,h,`rotateY(180deg) translateZ(${d/2}px)`,c[1]);
  F(d,h,`rotateY(90deg) translateZ(${w/2}px)`,c[1]);F(d,h,`rotateY(-90deg) translateZ(${w/2}px)`,c[1]);
  F(w,d,`rotateX(90deg) translateZ(${h/2}px)`,c[2]);F(w,d,`rotateX(-90deg) translateZ(${h/2}px)`,c[1]);return e}
const mk=(el,css)=>{el.style.cssText+=css;return el};
// --- rack
{const R=document.getElementById('rack'),spin=document.createElement('div');spin.className='abs';spin.style.cssText='--r0:-70deg;--r1:22deg;animation:spinY 4.65s cubic-bezier(.3,.1,.3,1) 0s both';
 for(let i=0;i<4;i++){const leds=[...Array(6)].map((_,k)=>`<i style="width:14px;height:14px;border-radius:50%;background:#46e28b;box-shadow:0 0 14px #46e28b;animation:led ${0.8+k*.13}s linear infinite"></i>`).join('');
  const b=box(520,80,340,['#1c3b80','#14295f','#2b57b0'],`<div style="display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 26px;font-weight:800;font-size:28px;color:#cfe3ff">GPU ×8<div style="display:flex;gap:10px">${leds}</div></div>`);
  b.style.transform=`translateY(${(i-1.5)*92+40}px)`;spin.appendChild(b)}
 R.appendChild(spin);const bob=document.createElement('div');bob.className='abs';R.parentNode.appendChild(bob)}
// --- bars
{const B=document.getElementById('bars');const n=8;
 for(let i=0;i<n;i++){const x=(i-(n-1)/2)*190,col=330-i*24,dbt=250;
  const low=col<dbt;
  const g=document.createElement('div');g.className='abs';g.style.cssText=`left:${x-45}px;top:0;transform-origin:50% 100%;animation:growY .6s cubic-bezier(.2,.8,.2,1) ${4.9+i*.42}s both`;
  g.appendChild(box(80,col*1.35,150,low?['#c8363d','#8d1b22','#ff6b73']:['#3a97ad','#27697a','#7fd3e4']));B.appendChild(g);
  const g2=document.createElement('div');g2.className='abs';g2.style.cssText=`left:${x+45}px;top:0;transform-origin:50% 100%;animation:growY .6s cubic-bezier(.2,.8,.2,1) ${5.0+i*.42}s both`;
  g2.appendChild(box(80,dbt*1.35,150,['#e6ecf8','#aab6cf','#ffffff']));B.appendChild(g2)}
 const lab=(t,x,c)=>{const d=document.createElement('div');d.className='t a';d.style.cssText=`left:${x}px;right:auto;width:220px;top:60px;font-size:34px;font-weight:800;color:${c};text-align:center`;d.dataset.an='fin';d.dataset.at='9.6';d.textContent=t;B.appendChild(d)};
 lab('■ залог',-330,'#7fd3e4');lab('■ долг',-100,'#e6ecf8')}
// --- nodes
{const N=document.getElementById('nodes');const items=[['🖥️','Серверы и GPU'],['📡','Телеметрия по API'],['🤖','Оценка и ИИ-наблюдатель']];
 items.forEach((it,i)=>{const x=(i-1)*560;const w=document.createElement('div');w.className='abs';w.style.cssText=`left:${x}px;top:0;`;w.dataset.an='pop3';w.dataset.at=13.1+i*.5;
  const bb=box(330,230,230,['#1d3f86','#142d68','#3a6fd0'],`<div class="node"><i>${it[0]}</i>${it[1]}</div>`);w.appendChild(bb);N.appendChild(w);
  if(i<2){const bm=document.createElement('div');bm.className='abs a beam';bm.style.cssText=`left:${x+190}px;top:-120px;width:180px;`;bm.dataset.an='fin';bm.dataset.at=13.5+i*.5;N.appendChild(bm)}})}
// --- kpis
{const K=document.getElementById('kpis');const it=[['Стоимость залога','94,0',' млн ₽',94,1,-560,15.85],['Покрытие долга','1,45','',1.45,2,0,16.15],['Рекомендуемый LTV','52,4',' %',52.4,1,560,16.45]];
 it.forEach(([l,v,u,val,dec,x,at])=>{const w=document.createElement('div');w.className='abs';w.style.cssText=`left:${x}px;top:0;`;w.dataset.an='flipin';w.dataset.at=at;
  const b=box(500,230,60,['#fff','#c8bfa8','#fff'],`<div class="kpi"><small>${l}</small><b><span data-count="${val}" data-dec="${dec}" data-at="${at}">0</span>${u}</b></div>`);w.appendChild(b);K.appendChild(w)});
 const w=document.createElement('div');w.className='abs';w.style.cssText='left:0;top:330px';w.dataset.an='flipin';w.dataset.at='17.1';
 w.appendChild(box(1500,120,50,['#fde6e7','#c9777c','#fff'],'<div class="alert"><i></i>Серийный номер GPU не совпадает с договором — подмена выявлена</div>'));K.appendChild(w)}
// --- logo
{const L=document.getElementById('logo3d');const w=document.createElement('div');w.className='abs';w.dataset.an='pop3';w.dataset.at='18.4';w.style.cssText='left:0;top:0';
 const sp=document.createElement('div');sp.className='abs';sp.style.cssText='--r0:70deg;--r1:-16deg;animation:spinY 2.4s cubic-bezier(.2,.8,.2,1) 18.3s both';
 sp.appendChild(box(1200,250,70,['#fff4e0','#c9b99a','#ffffff'],'<div style="display:flex;align-items:center;justify-content:center;height:100%;gap:26px;font-size:104px;font-weight:800;letter-spacing:-2px;color:#0b1f4b"><div style="width:140px;height:140px;border-radius:34px;background:#0b1f4b;color:#fff4e0;display:grid;place-items:center;font-size:84px">⛨</div><div><b>Compute</b><span style="font-weight:400">Collateral</span></div></div>'));
 w.appendChild(sp);L.appendChild(w);L.style.transform='translateY(120px)'}

// --- timeline
function setup(){
 $$('.scene',s=>{const f=+s.dataset.from,t=+s.dataset.to;s.style.animation=`fin .35s ease ${f}s both`+(t<90?`,fout .35s ease ${t-.35}s forwards`:'')});
 $$('[data-an]',e=>{const d=e.dataset.dur||.8;e.style.animation=(e.style.animation?e.style.animation+',':'')+`${e.dataset.an} ${d}s cubic-bezier(.2,.8,.2,1) ${e.dataset.at}s both`});
}
setup();
window.seek=t=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
 $$('[data-count]',e=>{const k=Math.min(1,Math.max(0,(t-e.dataset.at)/1.1)),v=+e.dataset.count*(1-Math.pow(1-k,3));e.textContent=v.toFixed(+e.dataset.dec).replace('.',',')})};
</script></body></html>
